name: LG Collared Report
author:
  - name: Tevin Temu
    organization: Wildlife Dynamics
    email: tevin@wildlifedynamics.com

description: Generates a movement analysis report for GPS-collared lions in the Amboseli ecosystem from EarthRanger, producing home range and subject track maps and speed and distance statistics per subject or group, on an interactive dashboard and in a Word report.
theory: "GPS observations are converted to relocations and trajectory segments, and segments with unrealistic length, duration, or speed are dropped to remove GPS noise. Home ranges are estimated per group with Elliptical Time Density (ETD), which spreads each segment's time across a grid using a maximum speed estimate, and are drawn as 50th to 99th percentile contours. Mean, minimum, and maximum speed and total distance covered are summarised from the cleaned trajectories."
output_comment: "Outputs a dashboard with mean, minimum, and maximum speed and distance covered widgets plus home range and subject tracks maps over EarthRanger conservancy and group ranch boundaries. Also writes cleaned relocations and trajectories (GeoParquet), HTML and PNG copies of each group's maps, a speed and distance summary CSV per group, and a Word report (overall_report.docx) with a cover page and one section per subject or group."
